[package]
name = "cutout-core"
description = "Platform-independent image engine for CutOut: layers, masks, selections, tools, compositing, project files and AI background removal."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ai"]
ai = ["dep:ort", "dep:half"]
# Windows GPU acceleration through DirectML (any DirectX 12 GPU). Optional: the
# CPU provider is always available and is the default.
directml = ["ai", "ort/directml"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
png = "0.18"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "half", "tls-native"] }
half = { version = "2", optional = true }

# Core ML execution provider: macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["coreml"] }

[dev-dependencies]
